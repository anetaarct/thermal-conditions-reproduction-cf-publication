website:
  site-url: "https://anetaarct.github.io/thermal-conditions-reproduction-cf-publication/"
  repo-url: "https://github.com/anetaarct/thermal-conditions-reproduction-cf-publication"
  repo-branch: main
  title: "Opposite climate effects on reproductive investment and success reveal hidden consistency patterns in a migratory bird"
  page-navigation: true
  sidebar:
    title: "Gotland flycatchers"
    style: docked
    search: true
    collapse-level: 2
    contents:
      - text: "Overview"
        href: index.qmd
      - section: "Start here"
        contents:
          - text: "Data preparation"
            href: workflow.qmd
          - text: "Sliding-window approach"
            href: climate_window.qmd
      - section: "Analyses & results"
        contents:
          - text: "Calendar-year analyses"
            href: temporal_trends.qmd
          - text: "Clutch size"
            href: clutch_size.qmd
          - text: "Egg-to-fledging success"
            href: fledging_success.qmd
          - text: "Temperature: within & between models"
            href: within_between.qmd
      - section: "Methods & reproducibility"
        contents:
          - text: "Study sample & predictors"
            href: data_preparation.qmd
          - text: "Model structure & diagnostics"
            href: model_structure.qmd
          - text: "Figure code"
            href: figure_code.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    number-sections: true
    code-fold: true
    code-summary: "Show code"
    code-tools: false
    fig-responsive: true
    include-after-body: _includes/r-runtime.html

execute:
  warning: false
  message: false
  freeze: auto

editor: source
